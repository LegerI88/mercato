<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mercato Légendaire</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Saira+Condensed:wght@600;700;800&display=swap">
<style>
/* Layout : un stade de nuit. Projecteurs, pelouse en perspective, tableau d'affichage. À gauche, la carte du joueur qui évolue ; à droite, le terrain des questions. Thème sombre unique, choisi volontairement. */
:root{
  color-scheme: dark;
  --bg:#0a1227; --bg2:#0f1a35; --panel:#131f40; --panel2:#18264d; --line:#283a68; --black:#02040b;
  --fg:#eef2ff; --muted:#a3b0d6; --faint:#6f7da6;
  --accent:#4cc9ff; --accent-ink:#04202e;
  --gold1:#fff3c2; --gold2:#f2c94c; --gold3:#b9852a; --gold-ink:#2a1c04;
  --leg1:#ffffff; --leg2:#a9dcff; --leg3:#3552b8; --leg-ink:#0a1640;
  --sil1:#f6f8fc; --sil2:#c8cfdc; --sil3:#7f8aa0; --sil-ink:#1b2130;
  --brz1:#f6d7b8; --brz2:#c98a56; --brz3:#80491f; --brz-ink:#2a1507;
  --pw1:#e9d5ff; --pw2:#a855f7; --pw3:#5b21b6; --pw-ink:#1e0838;
  --turf1:#0e3a29; --turf2:#124632; --lamp:#1d2440; --lamp-off:#3a4360; --net:#dfe7ff;
  --jersey:#1b2a5c; --jersey-trim:#f2c94c; --ok:#3ddc84; --ko:#ff5a6a; --yellow:#ffd21f; --red:#ee3b3b; --flash:#ffffff; --fire:#ff7a1a; --skin:#c98a5a;
  --display:"Saira Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 40px;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;position:relative;z-index:1}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:.01em}
.label{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.12em;font-size:.8rem;color:var(--muted)}

/* Stade */
.stadium{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:radial-gradient(60% 45% at 15% -5%, rgba(76,201,255,.18), transparent 70%),radial-gradient(60% 45% at 85% -5%, rgba(242,201,76,.14), transparent 70%),var(--bg)}
.beam{position:absolute;top:-8%;width:46vmax;height:135vh;background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,.02) 60%,transparent);clip-path:polygon(46% 0,54% 0,100% 100%,0 100%);transform-origin:50% 0}
.beam.b1{left:-8%;animation:sweep 9s ease-in-out infinite alternate}
.beam.b2{right:-8%;animation:sweep 12s ease-in-out infinite alternate-reverse}
.beam.b3{left:30%;opacity:.6;animation:sweep 15s ease-in-out infinite alternate}
@keyframes sweep{from{transform:rotate(-20deg)}to{transform:rotate(20deg)}}
.turf{position:absolute;left:-30%;right:-30%;bottom:-30vh;height:72vh;background:repeating-linear-gradient(90deg,var(--turf1) 0 7vw,var(--turf2) 7vw 14vw);transform:perspective(500px) rotateX(64deg);transform-origin:50% 100%;opacity:.55;-webkit-mask:linear-gradient(to top,#000 35%,transparent);mask:linear-gradient(to top,#000 35%,transparent)}
.stadium.dim .turf{opacity:.25}.stadium.dim .beam{opacity:.45}
.glitter{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--gold1);opacity:0;animation:glit 6s linear infinite}
@keyframes glit{0%{opacity:0;transform:translateY(0)}15%{opacity:.9}100%{opacity:0;transform:translateY(-40vh)}}

/* Boutons */
.btn-main{background:var(--gold2);color:var(--gold-ink);border:0;border-radius:999px;padding:12px 26px;font-family:var(--display);font-weight:800;font-size:1.2rem;letter-spacing:.06em;text-transform:uppercase;box-shadow:0 6px 0 var(--gold3);transition:transform .08s, box-shadow .08s, filter .2s}
.btn-main:hover{transform:translateY(-2px);filter:brightness(1.08)}
.btn-main:active{transform:translateY(4px);box-shadow:0 2px 0 var(--gold3)}
.btn-main:disabled{opacity:.5;cursor:not-allowed}
.btn-main.pulse{animation:btnPulse 1.4s ease-in-out infinite}
.btn-main.big{font-size:1.6rem;padding:16px 34px}
@keyframes btnPulse{0%,100%{box-shadow:0 6px 0 var(--gold3),0 0 0 0 rgba(242,201,76,.6)}50%{box-shadow:0 6px 0 var(--gold3),0 0 0 16px rgba(242,201,76,0)}}
.btn-ghost{background:transparent;border:1.5px solid var(--line);border-radius:999px;padding:9px 18px;font-weight:600;color:var(--fg)}
.btn-ghost:hover{border-color:var(--accent)}
.btn-var{background:var(--panel2);border:1.5px dashed var(--accent);color:var(--accent);border-radius:999px;padding:10px 18px;font-weight:700}
.btn-var.armed{background:var(--accent);color:var(--accent-ink);border-style:solid;animation:wob .3s infinite}
.btn-var.joker{border-color:var(--pw2);color:var(--pw1);border-style:solid}
@keyframes wob{50%{transform:rotate(-1.5deg)}}
.btn-var:disabled{opacity:.5;cursor:default;animation:none}

/* Splash */
.splash{position:fixed;inset:0;z-index:40;display:grid;place-items:center;text-align:center;padding:20px max(16px, env(safe-area-inset-right, 0px)) 20px max(16px, env(safe-area-inset-left, 0px))}
.splash-in{display:grid;justify-items:center;gap:22px}
.ball{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--flash),var(--sil2) 60%,var(--sil3));position:relative;animation:bounce 1.1s cubic-bezier(.3,0,.5,1) infinite alternate;box-shadow:0 30px 40px -18px rgba(0,0,0,.7)}
.ball::before{content:"";position:absolute;inset:32%;background:var(--bg);clip-path:polygon(50% 0,100% 38%,82% 100%,18% 100%,0 38%)}
@keyframes bounce{from{transform:translateY(-30px)}to{transform:translateY(20px) scaleY(.93)}}
.splash h1{font-size:clamp(2.6rem,10vw,5.6rem);line-height:.9;text-transform:uppercase;font-weight:800}
.splash h1 .g{color:var(--gold2);display:block}
.splash p{margin:0;color:var(--muted)}

/* Accueil */
.home{padding-block:26px 10px;display:grid;grid-template-columns:1.1fr .9fr;gap:36px;align-items:start}
.home > *{min-width:0}
.kicker{display:inline-flex;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 12px}
.home h1{font-size:clamp(2.4rem,7vw,5.2rem);line-height:.88;font-weight:800;text-transform:uppercase;margin-top:14px}
.home h1 .g{color:var(--gold2);display:block;white-space:nowrap;text-shadow:0 0 30px rgba(242,201,76,.35)}
.ltr{display:inline-block;animation:slam .55s cubic-bezier(.2,.9,.25,1.2) both;animation-delay:calc(var(--i) * 55ms)}
@keyframes slam{0%{transform:translateY(-70px) scale(1.8) rotate(-8deg);opacity:0}100%{transform:none;opacity:1}}
.story{color:var(--muted);font-size:1.06rem;max-width:62ch;margin:16px 0 0}
.story strong{color:var(--fg)}
.rules{list-style:none;padding:0;margin:20px 0 0;display:grid;gap:8px}
.rules li{display:flex;gap:12px;align-items:center;background:rgba(19,31,64,.85);border:1px solid var(--line);border-radius:12px;padding:9px 14px;animation:slideIn .5s both;animation-delay:calc(.6s + var(--i) * 90ms)}
@keyframes slideIn{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
.chip-card{flex:0 0 auto;width:18px;height:24px;border-radius:3px;display:inline-block}
.chip-card.y{background:var(--yellow)} .chip-card.r{background:var(--red)}
.chip-ico{flex:0 0 auto;width:30px;text-align:center;font-family:var(--display);font-weight:800;color:var(--accent)}
.signup{background:rgba(19,31,64,.94);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:grid;gap:14px;animation:slideUp .6s .3s both;box-shadow:0 30px 60px -30px rgba(0,0,0,.8)}
@keyframes slideUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
.signup h2{font-size:1.7rem;text-transform:uppercase}
.preview{display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:center}
.field{display:grid;gap:5px}
.field label,.flabel{font-weight:600;font-size:.92rem}
.field input,.field select{background:var(--bg2);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--fg);font:inherit;width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.emblems{display:flex;gap:8px;flex-wrap:wrap}
.emb-btn{width:46px;height:46px;border-radius:12px;background:var(--bg2);border:1.5px solid var(--line);display:grid;place-items:center;color:var(--gold2)}
.emb-btn[aria-pressed="true"]{border-color:var(--gold2);background:var(--panel2);box-shadow:0 0 0 3px rgba(242,201,76,.25)}
.emb-btn svg{width:26px;height:26px}
.err{color:var(--ko);font-weight:600;min-height:1.4em;margin:0}
.resume-box{background:var(--bg2);border:1px solid var(--gold3);border-radius:12px;padding:12px 14px;display:grid;gap:10px}
.prof-link{background:none;border:0;color:var(--faint);text-decoration:underline;padding:0;justify-self:start;font-size:.9rem}
.row-btns{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tog{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-weight:700;font-size:.8rem}
.tog[aria-pressed="false"]{opacity:.55;text-decoration:line-through}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(10,18,39,.93);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin-left:calc(-1 * max(16px, env(safe-area-inset-left, 0px)));margin-right:calc(-1 * max(16px, env(safe-area-inset-right, 0px)));padding:8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px))}
.hud-in{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.hud-team{min-width:0}
.hud-team b{font-family:var(--display);font-size:1.25rem;text-transform:uppercase;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hud-team span{color:var(--muted);font-size:.85rem}
.board{background:var(--black);border:2px solid var(--line);border-radius:12px;padding:3px 18px;text-align:center;min-width:150px;box-shadow:0 0 24px rgba(242,201,76,.15) inset}
.board .t{font-family:var(--display);font-weight:800;font-size:2.2rem;line-height:1;font-variant-numeric:tabular-nums;color:var(--gold2);text-shadow:0 0 12px rgba(242,201,76,.5)}
.board .l{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.board.warn .t{color:var(--yellow);animation:pulse 1s infinite}
.board.crit{border-color:var(--red);animation:critB .5s infinite alternate} .board.crit .t{color:var(--red);text-shadow:0 0 14px var(--red)}
@keyframes critB{to{box-shadow:0 0 22px var(--red)}}
.board.over{border-color:var(--red)} .board.over .t{color:var(--red)}
.board.bump{animation:bump .5s}
@keyframes bump{30%{transform:scale(1.18) rotate(-3deg);border-color:var(--ko)}}
@keyframes pulse{50%{opacity:.55}}
.hud-right{display:flex;gap:7px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.cnt{display:flex;gap:6px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-family:var(--display);font-weight:700;font-size:1.02rem}
.cnt.fire{border-color:var(--fire);color:var(--fire);animation:pulse 1.2s infinite}
.slots{display:flex;gap:6px;justify-content:center;margin-top:6px;flex-wrap:wrap}
.slot{min-width:30px;height:30px;border-radius:6px;border:1.5px dashed var(--line);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:.85rem;color:var(--faint);padding:0 6px}
.slot.on{border:0;background:linear-gradient(155deg,var(--gold1),var(--gold2) 45%,var(--gold3));color:var(--gold-ink)}
.slot.new{animation:slotIn .8s cubic-bezier(.2,.9,.3,1.4)}
@keyframes slotIn{0%{transform:scale(0) rotate(-180deg)}100%{transform:none}}
.slot.cur{border-color:var(--accent);color:var(--accent);animation:pulse 1.4s infinite}

/* Jeu */
.game{display:grid;grid-template-columns:270px minmax(0,1fr);gap:22px;margin-top:20px;align-items:start}
.game > *{min-width:0}
.aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 112px);display:grid;gap:12px;justify-items:center}
.bars{width:100%;background:rgba(19,31,64,.94);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:7px;position:relative}
.bar{display:grid;grid-template-columns:38px 1fr 28px;gap:8px;align-items:center;font-family:var(--display);font-weight:700;font-size:.9rem;position:relative}
.bar .tr{height:8px;border-radius:99px;background:var(--bg);overflow:hidden;position:relative}
.bar .tr i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--accent),var(--gold2));border-radius:99px;transition:width .8s cubic-bezier(.2,.9,.3,1)}
.bar .tr s{position:absolute;top:0;bottom:0;width:2px;background:var(--faint)}
.bar b{text-align:right;font-variant-numeric:tabular-nums}
.bar.glow b{color:var(--ok);animation:pop .5s}
.floater{position:absolute;right:-6px;font-family:var(--display);font-weight:800;color:var(--ok);font-size:1.3rem;pointer-events:none;animation:floatUp 1.4s ease-out both;text-shadow:0 0 10px rgba(61,220,132,.6)}
@keyframes floatUp{0%{opacity:0;transform:translateY(10px) scale(.6)}20%{opacity:1;transform:translateY(0) scale(1.2)}100%{opacity:0;transform:translateY(-36px) scale(1)}}
.powers{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.pw{display:flex;gap:6px;align-items:center;background:linear-gradient(135deg,var(--pw2),var(--pw3));color:var(--pw1);border-radius:8px;padding:4px 10px;font-family:var(--display);font-weight:800;font-size:.85rem;letter-spacing:.06em;text-transform:uppercase}
.qpanel{background:rgba(19,31,64,.95);border:1px solid var(--line);border-radius:18px;overflow:hidden;animation:qIn .45s cubic-bezier(.2,.9,.3,1.1) both;box-shadow:0 30px 60px -30px rgba(0,0,0,.8)}
@keyframes qIn{from{opacity:0;transform:translateX(40px) rotate(1deg)}to{opacity:1;transform:none}}
.qpanel.hit{animation:hit .45s}
.qpanel.win{box-shadow:0 0 0 3px var(--ok),0 0 50px rgba(61,220,132,.35)}
@keyframes hit{20%{transform:translateX(-12px) rotate(-.6deg)}40%{transform:translateX(10px) rotate(.5deg)}60%{transform:translateX(-7px)}80%{transform:translateX(4px)}}
.q-head{padding:14px 20px;background:linear-gradient(90deg,var(--panel2),transparent);border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.q-head .qn{font-family:var(--display);font-weight:800;font-size:1.5rem;text-transform:uppercase;line-height:1}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-family:var(--display);font-weight:800;font-size:.9rem;letter-spacing:.04em}
.chip.st{background:var(--gold2);color:var(--gold-ink)}
.chip.ty{background:var(--bg2);border:1px solid var(--line);color:var(--muted)}
.chip.try2{background:var(--yellow);color:var(--black)}
.dots{display:flex;gap:5px;margin-left:auto}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.d1{background:var(--ok)}.dots i.d2{background:var(--yellow)}.dots i.d0{background:var(--ko)}.dots i.cur{background:var(--accent);animation:pulse 1s infinite}
.q-body{padding:18px 20px;display:grid;gap:16px}
.q-title{font-size:1.15rem;font-weight:700;margin:0;max-width:75ch}
.q-foot{padding:14px 20px 18px;border-top:1px solid var(--line);display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.feedback{padding:0 20px 16px;margin:0;font-weight:600;min-height:1.4em}
.feedback.ko{color:var(--ko)} .feedback.ok{color:var(--ok)}
.hint{margin:0 20px 14px;background:var(--bg2);border-left:4px solid var(--accent);border-radius:8px;padding:12px 14px;animation:slideIn .4s both}
.hint b{color:var(--accent)}
.explain{margin:0 20px 16px;border-radius:10px;padding:12px 14px;animation:slideUp .4s both}
.explain.ok{background:rgba(61,220,132,.12);border:1px solid var(--ok)}
.explain.ko{background:rgba(255,90,106,.1);border:1px solid var(--ko)}
.explain b{color:var(--fg)}

/* Types d'activités */
.zone-t{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-size:.82rem;margin-bottom:8px}
.bench{display:flex;flex-wrap:wrap;gap:10px;min-height:48px}
.step{background:var(--bg2);border:1.5px solid var(--line);border-radius:10px;padding:9px 13px;font-weight:600;text-align:left;transition:transform .15s,border-color .15s}
.step:hover{border-color:var(--gold2);transform:translateY(-3px) rotate(-1deg)}
.pitch{background:repeating-linear-gradient(90deg,var(--turf1) 0 60px,var(--turf2) 60px 120px);border-radius:12px;padding:12px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pslot{min-height:60px;border:2px dashed rgba(255,255,255,.35);border-radius:10px;display:flex;align-items:center;gap:10px;padding:8px 10px;color:rgba(255,255,255,.7)}
.pslot .n{font-family:var(--display);font-weight:800;font-size:1.5rem;color:rgba(255,255,255,.85);flex:0 0 auto}
.pslot button{flex:1;background:var(--fg);color:var(--bg);border:0;border-radius:8px;padding:8px 10px;font-weight:700;text-align:left;min-width:0;animation:pop .3s cubic-bezier(.2,.9,.3,1.5)}
@keyframes pop{from{transform:scale(.5)}to{transform:none}}
.opts{display:grid;gap:8px}
.opt{background:var(--bg2);border:1.5px solid var(--line);border-radius:10px;padding:10px 14px;text-align:left;transition:transform .15s,border-color .15s}
.opt:hover{transform:translateX(6px);border-color:var(--gold3)}
.opt[aria-pressed="true"]{border-color:var(--gold2);background:var(--panel2)}
.opt.right{border-color:var(--ok);background:rgba(61,220,132,.15)}
.rowx{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:9px 14px}
.rowx p{margin:0}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{min-width:44px;background:var(--panel);border:1.5px solid var(--line);border-radius:8px;padding:7px 10px;font-family:var(--display);font-weight:800;transition:transform .1s}
.seg button:active{transform:scale(.9)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.match{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.mcol{display:grid;gap:8px;align-content:start}
.mitem{display:flex;gap:10px;align-items:center;background:var(--bg2);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;text-align:left;min-height:46px;transition:border-color .15s,transform .15s}
.mitem:hover{border-color:var(--gold3)}
.mitem.sel{border-color:var(--accent);box-shadow:0 0 0 3px rgba(76,201,255,.25);transform:scale(1.02)}
.mitem .badge{flex:0 0 26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:.95rem;background:var(--line);color:var(--muted)}
.mitem.paired .badge{color:var(--black)}
.c0{background:var(--gold2)!important}.c1{background:var(--accent)!important}.c2{background:var(--ok)!important}.c3{background:var(--fire)!important}.c4{background:var(--pw1)!important}.c5{background:var(--yellow)!important}
.inputs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.inq{background:var(--bg2);border:1.5px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:6px}
.inq label{font-weight:700}
.inq .row{display:flex;align-items:center;gap:8px}
.inq input{flex:1;min-width:0;background:var(--panel);border:1.5px solid var(--line);border-radius:8px;padding:9px 10px;color:var(--fg);font:inherit;font-variant-numeric:tabular-nums}
.inq .u{font-weight:700;color:var(--muted)}
.inq.ok{border-color:var(--ok)} .inq.ko{border-color:var(--ko);animation:hit .4s}
.ticket{background:var(--fg);color:var(--bg);border-radius:10px;padding:14px 16px;font-variant-numeric:tabular-nums;max-width:520px}
.ticket h4{margin:0 0 6px;font-family:var(--display);font-size:1.2rem;text-transform:uppercase}
.ticket table{width:100%;border-collapse:collapse;color:inherit;font:inherit}
.ticket td{padding:4px 0;border-bottom:1px dashed rgba(10,18,39,.25)}
.ticket td:last-child{text-align:right;font-weight:700}
.tactic{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.tactic ul{margin:6px 0 0;padding-left:18px}
.tactic li{margin:3px 0}
.fill{font-size:1.08rem;line-height:2.4;margin:0}
.fill select{background:var(--panel2);border:1.5px solid var(--gold3);border-radius:8px;padding:5px 8px;color:var(--fg);font:inherit;font-weight:700;max-width:100%}
.profile{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:var(--bg2);border:1px solid var(--gold3);border-radius:12px;padding:12px 14px}
.avatar{width:54px;height:54px;border-radius:50%;background:var(--gold2);color:var(--gold-ink);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.5rem}
.profile ul{margin:4px 0 0;padding-left:18px;color:var(--muted)}
.profile ul b{color:var(--fg)}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.prod{background:var(--bg2);border:2px solid var(--line);border-radius:12px;padding:12px;text-align:left;display:grid;gap:6px;transition:transform .15s,border-color .15s}
.prod:hover{transform:translateY(-4px)}
.prod h4{margin:0;font-family:var(--display);font-size:1.2rem;text-transform:uppercase}
.prod dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:.92rem}
.prod dt{color:var(--muted)} .prod dd{margin:0;font-weight:700;font-variant-numeric:tabular-nums}
.prod[aria-pressed="true"]{border-color:var(--gold2);background:var(--panel2);box-shadow:0 0 0 3px rgba(242,201,76,.25),0 0 30px rgba(242,201,76,.25)}
.sit{display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:12px;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.sit p{margin:0}
.sit select{background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;color:var(--fg);font:inherit;width:100%}
.vstat-legend{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:.9rem}
.vstat-legend b{color:var(--fg);font-family:var(--display)}
.money{display:grid;gap:12px}
.cash{display:flex;flex-wrap:wrap;gap:10px}
.bill{border:0;border-radius:6px;padding:0;width:84px;height:46px;font-family:var(--display);font-weight:800;font-size:1.15rem;color:var(--black);box-shadow:0 4px 0 rgba(0,0,0,.35);transition:transform .1s}
.bill:active{transform:translateY(3px)}
.bill.b10{background:linear-gradient(135deg,#f2a38a,#d9735a)}.bill.b5{background:linear-gradient(135deg,#c9d2dc,#8e9aa8)}.bill.b20{background:linear-gradient(135deg,#9cc3f0,#4f86c9)}
.coin{border:0;border-radius:50%;width:54px;height:54px;font-family:var(--display);font-weight:800;font-size:.95rem;color:var(--black);box-shadow:0 4px 0 rgba(0,0,0,.35),inset 0 0 0 4px rgba(255,255,255,.35);transition:transform .1s}
.coin:active{transform:translateY(3px)}
.coin.cg{background:radial-gradient(circle at 35% 30%,var(--gold1),var(--gold2) 60%,var(--gold3))}
.coin.cc{background:radial-gradient(circle at 35% 30%,#ffd0a8,#c98a56 60%,#80491f)}
.coin.cb{background:radial-gradient(circle at 35% 30%,#ffffff,#c8cfdc 55%,var(--gold2))}
.tray{min-height:70px;background:var(--turf1);border:2px dashed rgba(255,255,255,.3);border-radius:12px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tray .bill,.tray .coin{animation:pop .3s cubic-bezier(.2,.9,.3,1.5)}
.tray-sum{font-family:var(--display);font-weight:800;font-size:1.4rem;font-variant-numeric:tabular-nums}

/* Cartes */
.fcard{--c1:var(--gold1);--c2:var(--gold2);--c3:var(--gold3);--ink:var(--gold-ink);position:relative;width:180px;max-width:100%;aspect-ratio:.7;clip-path:polygon(12% 0,88% 0,100% 7%,100% 85%,50% 100%,0 85%,0 7%);background:linear-gradient(155deg,var(--c1) 0%,var(--c2) 40%,var(--c3) 72%,var(--c2) 100%);color:var(--ink);display:flex;flex-direction:column;align-items:center;padding:14px 12px 26px;overflow:hidden;transition:transform .25s;flex:0 0 auto}
.fcard::after{content:"";position:absolute;inset:-40%;background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.6) 50%,transparent 58%);transform:translateX(-60%);animation:shine 3.5s ease-in-out infinite;pointer-events:none}
@keyframes shine{0%,55%{transform:translateX(-60%)}100%{transform:translateX(60%)}}
.fcard.t-legend{--c1:var(--leg1);--c2:var(--leg2);--c3:var(--leg3);--ink:var(--leg-ink)}
.fcard.t-silver{--c1:var(--sil1);--c2:var(--sil2);--c3:var(--sil3);--ink:var(--sil-ink)}
.fcard.t-bronze{--c1:var(--brz1);--c2:var(--brz2);--c3:var(--brz3);--ink:var(--brz-ink)}
.fcard.t-power{--c1:var(--pw1);--c2:var(--pw2);--c3:var(--pw3);--ink:var(--pw-ink)}
.fcard.t-power .fc-emb,.fcard.t-power .fc-name,.fcard.t-power .fc-foot{color:var(--pw1)}
.fcard.locked{--c1:var(--panel2);--c2:var(--panel);--c3:var(--bg2);--ink:var(--faint)}
.fcard.locked::after{display:none}
.fc-top{align-self:stretch;display:flex;justify-content:space-between;align-items:flex-start}
.fc-note{font-family:var(--display);font-weight:800;font-size:2.4rem;line-height:.9;font-variant-numeric:tabular-nums}
.fc-pos{font-family:var(--display);font-weight:700;font-size:.95rem;display:block}
.fc-tag{font-family:var(--display);font-weight:800;font-size:.72rem;letter-spacing:.1em;border:1.5px solid currentColor;border-radius:4px;padding:1px 5px}
.fc-emb{width:44%;aspect-ratio:1;border-radius:50%;border:3px solid currentColor;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:2.4rem;margin:2px 0 4px;background:rgba(255,255,255,.18)}
.fc-emb svg{width:60%;height:60%}
.fc-face{width:62%;aspect-ratio:1;margin:-28px 0 0;position:relative;z-index:1}
.fc-face svg{width:100%;height:100%;display:block}
.fcard.big .fc-face{margin-top:-40px}
.fcard.sm .fc-face{margin-top:-20px}
.avs{display:flex;gap:8px;flex-wrap:wrap}
.av-btn{width:58px;height:58px;border-radius:12px;background:var(--bg2);border:1.5px solid var(--line);padding:2px;overflow:hidden}
.av-btn svg{width:100%;height:100%;display:block}
.av-btn[aria-pressed="true"]{border-color:var(--gold2);background:var(--panel2);box-shadow:0 0 0 3px rgba(242,201,76,.25)}
.sws{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid var(--line)}
.sw[aria-pressed="true"]{border-color:var(--gold2);box-shadow:0 0 0 3px rgba(242,201,76,.35)}
.credit{margin:10px 0 0;font-family:var(--display);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold2);font-size:.95rem}
.fc-name{font-family:var(--display);font-weight:800;font-size:1.15rem;text-transform:uppercase;text-align:center;line-height:1.05;border-bottom:1.5px solid currentColor;padding-bottom:4px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fc-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:2px 10px;margin-top:6px;font-family:var(--display);font-size:.85rem;text-align:center}
.fc-stats b{font-size:1.05rem;display:block;line-height:1;font-variant-numeric:tabular-nums}
.fc-foot{font-size:.68rem;font-weight:700;margin-top:auto;text-transform:uppercase;letter-spacing:.08em;opacity:.85;text-align:center}
.fcard.big{width:250px}
.fcard.big .fc-note{font-size:3.4rem}
.fcard.big .fc-name{font-size:1.5rem}
.fcard.big .fc-stats{font-size:1rem}
.fcard.big .fc-stats b{font-size:1.3rem}
.fcard.big .fc-emb{font-size:3rem;width:36%}
.fcard.sm{width:140px;padding:10px 8px 20px}
.fcard.sm .fc-note{font-size:1.8rem}.fcard.sm .fc-name{font-size:.9rem}.fcard.sm .fc-emb{font-size:1.8rem}.fcard.sm .fc-stats{font-size:.7rem;gap:1px 6px}.fcard.sm .fc-stats b{font-size:.85rem}
.cards-row{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.cards-row > *{animation:dealIn .6s cubic-bezier(.2,.9,.3,1.2) backwards;animation-delay:calc(var(--i,0) * 110ms)}
.cards-row .fcard:hover{transform:translateY(-8px) rotate(-2deg) scale(1.04)}
@keyframes dealIn{from{opacity:0;transform:translateY(-60px) rotate(-14deg) scale(.6)}to{opacity:1;transform:none}}
.card-wrap{perspective:1000px}
.card-wrap.flipnow > .fcard{animation:flipIn .9s cubic-bezier(.2,.8,.2,1)}

/* Effets plein écran */
#gfx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:95}
#fxlayer{position:relative;z-index:70}
.banner{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:rgba(2,4,11,.8);animation:fadeio 2.3s both;overflow:hidden}
.band{width:140vw;background:linear-gradient(90deg,var(--gold3),var(--gold2),var(--gold1),var(--gold2),var(--gold3));color:var(--gold-ink);padding:16px 0 20px;text-align:center;animation:bandIn 2.3s cubic-bezier(.2,.8,.2,1) both;box-shadow:0 0 80px rgba(242,201,76,.55)}
.band small{display:block;font-family:var(--display);font-weight:800;font-size:clamp(1rem,2.6vw,1.4rem);letter-spacing:.45em}
.band strong{font-family:var(--display);font-weight:800;font-size:clamp(2.6rem,10vw,6rem);line-height:1;text-transform:uppercase;display:block}
.band span{display:block;font-weight:700;font-size:clamp(.95rem,2.4vw,1.25rem)}
@keyframes bandIn{0%{transform:rotate(-6deg) translateX(-130%)}20%{transform:rotate(-6deg) translateX(2%)}28%,76%{transform:rotate(-6deg) translateX(0)}100%{transform:rotate(-6deg) translateX(130%)}}
@keyframes fadeio{0%{opacity:0}8%,86%{opacity:1}100%{opacity:0}}
.goal{position:fixed;inset:0;z-index:70;display:grid;place-items:center;align-content:center;gap:6px;pointer-events:none;background:radial-gradient(circle,rgba(61,220,132,.35),rgba(2,4,11,.55) 70%);animation:fadeio 1.25s both;text-align:center}
.goal .gt{font-family:var(--display);font-weight:800;font-size:clamp(3.5rem,16vw,10rem);line-height:.9;color:var(--fg);text-shadow:0 0 40px var(--ok),0 8px 0 var(--gold3);animation:goalPop 1.25s cubic-bezier(.2,.9,.3,1.3) both}
.goal .gs{font-family:var(--display);font-weight:800;font-size:clamp(1.4rem,5vw,2.6rem);color:var(--ok);letter-spacing:.1em;animation:goalPop 1.25s .1s both}
@keyframes goalPop{0%{transform:scale(.1) rotate(-15deg)}22%{transform:scale(1.2) rotate(4deg)}32%{transform:scale(1) rotate(0)}60%{transform:scale(1.06)}100%{transform:scale(1.12)}}
.upgrade{position:fixed;inset:0;z-index:72;display:grid;place-items:center;align-content:center;gap:16px;background:radial-gradient(circle,rgba(242,201,76,.3),rgba(2,4,11,.92) 70%);text-align:center;padding:20px}
.upgrade h2{font-size:clamp(2.4rem,9vw,5rem);text-transform:uppercase;color:var(--gold2);text-shadow:0 0 40px rgba(242,201,76,.7);animation:goalPop 1.2s both;line-height:1}
.upgrade p{margin:0;font-family:var(--display);font-weight:800;font-size:1.4rem;letter-spacing:.1em;text-transform:uppercase}
.upgrade .card-wrap .fcard{animation:flipIn 1.1s .3s cubic-bezier(.2,.8,.2,1) both}
.intro{position:fixed;inset:0;z-index:75;background:var(--black);display:grid;place-items:center;overflow:hidden;transition:background 1s}
.intro.l1{background:radial-gradient(circle at 20% 0,rgba(255,255,255,.12),var(--black) 60%)}
.intro.l2{background:radial-gradient(circle at 20% 0,rgba(255,255,255,.12),transparent 55%),radial-gradient(circle at 50% 0,rgba(255,255,255,.14),var(--black) 60%)}
.intro.l3{background:radial-gradient(circle at 20% 0,rgba(255,255,255,.14),transparent 55%),radial-gradient(circle at 80% 0,rgba(255,255,255,.14),transparent 55%),radial-gradient(circle at 50% 30%,var(--turf2),var(--black) 75%)}
.lights{position:absolute;top:5vh;left:0;right:0;display:flex;justify-content:space-around}
.lamp{width:clamp(56px,10vw,120px);aspect-ratio:1.6;border-radius:10px;background:var(--lamp);display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);gap:5px;padding:7px;border:2px solid var(--lamp-off)}
.lamp i{background:var(--lamp-off);border-radius:50%;transition:background .1s,box-shadow .1s}
.lamp.on i{background:var(--flash);box-shadow:0 0 22px 4px var(--flash)}
.count{font-family:var(--display);font-weight:800;font-size:clamp(7rem,32vw,18rem);line-height:1;color:var(--gold2);text-shadow:0 0 50px rgba(242,201,76,.7);animation:countPop .85s cubic-bezier(.2,.9,.3,1.3) both}
.count.go{font-size:clamp(3.2rem,13vw,8rem);color:var(--fg);text-shadow:0 0 40px var(--accent);text-align:center;text-transform:uppercase}
@keyframes countPop{0%{transform:scale(3);opacity:0;filter:blur(10px)}35%{transform:scale(1);opacity:1;filter:none}85%{opacity:1}100%{transform:scale(.7);opacity:0}}
.intro .who{position:absolute;bottom:5vh;display:grid;justify-items:center;gap:8px;animation:slideUp 1s both}
.intro .who span{font-family:var(--display);font-weight:800;font-size:clamp(1.2rem,3.5vw,1.8rem);text-transform:uppercase;letter-spacing:.2em;color:var(--muted)}

/* Overlays */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(5,9,22,.92);display:grid;place-items:center;padding:20px max(16px, env(safe-area-inset-right, 0px)) 20px max(16px, env(safe-area-inset-left, 0px));overflow:auto}
.reveal{display:grid;justify-items:center;gap:14px;max-width:760px;text-align:center;position:relative}
.reveal h2{font-size:clamp(2rem,6vw,2.8rem);text-transform:uppercase;color:var(--gold2);line-height:1}
.reveal .rays-s{position:absolute;left:50%;top:200px;width:700px;height:700px;margin:-350px 0 0 -350px;background:repeating-conic-gradient(from 0deg,rgba(242,201,76,.2) 0 7deg,transparent 7deg 20deg);border-radius:50%;animation:spin 14s linear infinite;-webkit-mask:radial-gradient(circle,#000 15%,transparent 65%);mask:radial-gradient(circle,#000 15%,transparent 65%);z-index:-1;pointer-events:none}
.mini-pack{width:170px;height:240px;border-radius:14px;background:linear-gradient(160deg,var(--gold1),var(--gold2) 35%,var(--gold3) 70%,var(--gold2));box-shadow:0 0 70px rgba(242,201,76,.7);display:grid;place-items:center;color:var(--gold-ink);font-family:var(--display);font-weight:800;font-size:3rem;text-align:center;line-height:1;animation:shake .1s infinite}
.flip-in{animation:flipIn 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes flipIn{0%{transform:rotateY(540deg) scale(.4);opacity:0}60%{transform:rotateY(-12deg) scale(1.08);opacity:1}100%{transform:none}}
.key{font-family:var(--display);font-weight:800;font-size:1.3rem;margin:0}
.key span{display:inline-grid;place-items:center;width:46px;height:46px;border-radius:10px;background:var(--gold2);color:var(--gold-ink);font-size:1.9rem;margin-left:8px;vertical-align:middle;animation:keyPop .6s .8s cubic-bezier(.2,.9,.3,1.6) both}
@keyframes keyPop{from{transform:scale(0) rotate(-90deg)}to{transform:none}}
.gains{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.gain{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-family:var(--display);font-weight:800;font-size:1.1rem;animation:keyPop .5s both;animation-delay:calc(1s + var(--i) * 120ms)}
.gain em{font-style:normal;color:var(--ok)}
.recap{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;color:var(--muted);font-weight:600}
.recap b{color:var(--fg);font-family:var(--display);font-size:1.3rem}
.penalty{position:fixed;inset:0;z-index:60;display:grid;place-items:center;pointer-events:none}
.penalty .card{width:110px;height:155px;border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,.5);animation:cardIn 1.5s ease both}
.penalty .card.y{background:var(--yellow)} .penalty .card.r{background:var(--red)} .penalty .card.s{background:linear-gradient(135deg,var(--pw2),var(--pw3))}
.penalty .txt{position:absolute;top:calc(50% + 92px);font-family:var(--display);font-weight:800;font-size:2.2rem;text-transform:uppercase;text-align:center;animation:fadeUp 1.5s ease both;text-shadow:0 3px 12px rgba(0,0,0,.6)}
.penalty .txt small{display:block;font-size:1.4rem;color:var(--ko)}
.penalty.red{animation:redFlash 1.6s both}
@keyframes redFlash{0%,20%,40%{background:rgba(238,59,59,.35)}10%,30%{background:rgba(238,59,59,.05)}100%{background:rgba(238,59,59,0)}}
@keyframes cardIn{0%{transform:translateY(60px) rotate(-25deg) scale(.4);opacity:0}20%{transform:rotate(8deg) scale(1.1);opacity:1}35%{transform:rotate(-4deg) scale(1)}85%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}
@keyframes fadeUp{0%,15%{opacity:0;transform:translateY(10px)}25%,85%{opacity:1;transform:none}100%{opacity:0}}
.alert5{position:fixed;inset:0;z-index:65;display:grid;place-items:center;pointer-events:none;background:rgba(238,59,59,.15);animation:fadeio 2.4s both}
.alert5 b{font-family:var(--display);font-weight:800;font-size:clamp(2.6rem,10vw,6rem);text-transform:uppercase;color:var(--yellow);text-shadow:0 0 30px var(--red);animation:goalPop 2.4s both;text-align:center;line-height:1}

/* Code & tirs au but */
.final{margin-top:24px;display:grid;gap:20px;justify-items:center;text-align:center}
.final h2{font-size:clamp(2.2rem,6vw,3.6rem);text-transform:uppercase;line-height:.95}
.final h2 .g{color:var(--gold2)}
.final p{max-width:64ch;color:var(--muted);margin:0}
.final p strong{color:var(--fg)}
.codebox{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
.codebox input{width:240px;max-width:100%;text-align:center;font-family:var(--display);font-weight:800;font-size:2.4rem;letter-spacing:.35em;background:var(--bg2);border:2px solid var(--gold3);border-radius:12px;padding:6px 10px;color:var(--gold2);font-variant-numeric:tabular-nums}
.codebox input.hitx{animation:hit .45s;border-color:var(--ko)}
.shoot{display:grid;gap:14px;justify-items:center;width:100%;max-width:760px}
.goalbox{width:100%;max-width:560px;position:relative}
.goalbox svg{width:100%;height:auto;display:block;border-radius:12px}
.sball{transition:transform .55s cubic-bezier(.3,.6,.4,1)}
.keeper{transition:transform .45s cubic-bezier(.3,.7,.3,1);transform-origin:200px 140px}
.netshake{animation:hit .5s}
.score-dots{display:flex;gap:10px}
.score-dots i{width:22px;height:22px;border-radius:50%;border:2px solid var(--line)}
.score-dots i.g{background:var(--ok);border-color:var(--ok)}.score-dots i.m{background:var(--ko);border-color:var(--ko)}.score-dots i.c{border-color:var(--accent);animation:pulse 1s infinite}
.shot-q{width:100%;background:rgba(19,31,64,.95);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:10px;text-align:left}
.shot-timer{height:8px;border-radius:99px;background:var(--bg);overflow:hidden}
.shot-timer i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),var(--yellow),var(--red));transform-origin:left;animation:drain linear forwards}
@keyframes drain{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.shot-res{font-family:var(--display);font-weight:800;font-size:clamp(2.2rem,8vw,4rem);text-transform:uppercase;min-height:1.1em;line-height:1}
.shot-res.g{color:var(--ok);animation:goalPop 1s both}.shot-res.m{color:var(--ko);animation:goalPop 1s both}

#finale{position:fixed;inset:0;z-index:80;background:radial-gradient(circle at 50% 45%,var(--bg2),var(--black) 75%);overflow:hidden}
.fin-stage{position:absolute;inset:0;display:grid;place-items:center;z-index:2}
.fin-stage > *{grid-area:1/1}
.rays{position:absolute;left:50%;top:50%;margin:-80vmax 0 0 -80vmax;width:160vmax;height:160vmax;background:repeating-conic-gradient(from 0deg,rgba(242,201,76,.18) 0 6deg,transparent 6deg 18deg);border-radius:50%;opacity:0;transition:opacity 1.2s;animation:spin 18s linear infinite;-webkit-mask:radial-gradient(circle,#000 10%,transparent 60%);mask:radial-gradient(circle,#000 10%,transparent 60%)}
.rays.on{opacity:1}.rays.fast{animation-duration:3s}
@keyframes spin{to{transform:rotate(360deg)}}
.pack{width:200px;height:290px;border-radius:16px;background:linear-gradient(160deg,var(--gold1),var(--gold2) 35%,var(--gold3) 70%,var(--gold2));box-shadow:0 0 60px rgba(242,201,76,.6),0 0 0 3px rgba(255,255,255,.4) inset;display:grid;place-items:center;color:var(--gold-ink);animation:packIn .8s cubic-bezier(.2,.8,.2,1) both}
.pack-in{display:grid;justify-items:center;gap:6px;font-family:var(--display);font-weight:800;text-transform:uppercase;text-align:center}
.pack-in .lg{font-size:4rem;line-height:1;border:4px solid currentColor;border-radius:50%;width:110px;height:110px;display:grid;place-items:center}
.pack-in .lg svg{width:64px;height:64px}
@keyframes packIn{from{transform:scale(.2) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}
.pack.s1{animation:shake .35s infinite}
.pack.s2{animation:shake .16s infinite;box-shadow:0 0 120px rgba(255,255,255,.8),0 0 0 3px rgba(255,255,255,.6) inset}
.pack.s3{animation:shake .06s infinite;box-shadow:0 0 240px var(--flash),0 0 0 3px var(--flash) inset;transform:scale(1.1)}
@keyframes shake{0%,100%{translate:0 0;rotate:0deg}25%{translate:-6px 3px;rotate:-2deg}50%{translate:6px -3px;rotate:2deg}75%{translate:-3px -4px;rotate:-1deg}}
.flash{position:absolute;inset:0;background:var(--flash);z-index:4;pointer-events:none;animation:flash .9s ease-out both}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
.walkout{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:clamp(2.6rem,12vw,8rem);color:var(--gold2);text-align:center;line-height:1;text-shadow:0 0 40px rgba(242,201,76,.6);padding:0 16px}
.walkout .w{animation:walk .85s cubic-bezier(.2,.8,.2,1) both;display:block}
.walkout .w small{display:block;font-size:.25em;letter-spacing:.3em;color:var(--fg)}
@keyframes walk{0%{transform:scale(2.4);opacity:0;filter:blur(8px)}30%{transform:scale(1);opacity:1;filter:none}80%{opacity:1}100%{opacity:0;transform:scale(.9)}}
#end{position:absolute;inset:0;overflow:auto;display:grid;place-items:center;z-index:5;pointer-events:none}
.fin-end{display:grid;justify-items:center;gap:14px;padding:20px;pointer-events:auto}
.fin-title{font-family:var(--display);font-weight:800;font-size:clamp(2rem,7vw,3.6rem);text-transform:uppercase;color:var(--fg);text-shadow:0 0 30px rgba(76,201,255,.6);text-align:center;line-height:1;animation:goalPop 1.2s both}
.fin-card-in{animation:finCard 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes finCard{0%{transform:translateY(-120vh) rotate(-30deg) scale(.5)}70%{transform:translateY(10px) rotate(3deg) scale(1.05)}100%{transform:none}}
.glow{filter:drop-shadow(0 0 30px rgba(242,201,76,.7))}
.shakeall{animation:hit .5s}

/* Résultat */
.result{margin-top:26px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:start}
.result > *{min-width:0}
.res-side{display:grid;justify-items:center;gap:12px}
.res-main{display:grid;gap:18px}
.res-main h2{font-size:2.4rem;text-transform:uppercase;line-height:1}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;animation:slideUp .5s both;animation-delay:calc(var(--i) * 70ms)}
.kpi b{display:block;font-family:var(--display);font-size:1.8rem;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:.85rem}
.charts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.chartbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px}
.chartbox svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
table.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:520px}
.tbl th,.tbl td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line)}
.tbl th{font-family:var(--display);text-transform:uppercase;letter-spacing:.08em;font-size:.82rem;color:var(--muted);background:var(--panel)}
.tbl td.n{text-align:right}
.send{background:var(--panel2);border:1px solid var(--gold3);border-radius:14px;padding:16px;display:grid;gap:12px}
.send p{margin:0;color:var(--muted)}
.send img{border-radius:10px;border:1px solid var(--line);max-width:260px;width:100%}
.res-actions{display:flex;gap:10px;flex-wrap:wrap}

/* Album & prof */
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;max-width:900px;width:100%;display:grid;gap:14px;max-height:calc(100vh - 40px);overflow:auto}
.modal h2{font-size:1.8rem;text-transform:uppercase}
.modal h3{font-family:var(--body);font-size:1.05rem;margin-top:6px}
.modal ol,.modal ul{margin:0;padding-left:20px}
.modal li{margin:3px 0}
.modal a{color:var(--accent)}
.modal .small{font-size:.88rem;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);border-radius:999px;padding:10px 18px;font-weight:700;z-index:90;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:calc(100vw - 32px);animation:slideUp .3s both}

@media (max-width:900px){
  .home,.result,.game{grid-template-columns:1fr}

  .aside .powers,.aside .album-btn{grid-column:1/-1;justify-self:center}
  .inputs,.match,.charts{grid-template-columns:1fr}
  .pitch{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hud-in{grid-template-columns:1fr auto}
  .hud-right{grid-column:1/-1;justify-content:flex-start}
  .sit{grid-template-columns:1fr}
}

  .board{min-width:108px;padding:3px 10px}
  .aside{grid-template-columns:1fr;justify-items:center}
}

  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}
}

let AC=null,NB=null,MASTER=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();MASTER=AC.createDynamicsCompressor();MASTER.threshold.value=-16;MASTER.knee.value=10;MASTER.ratio.value=6;MASTER.attack.value=0.003;MASTER.release.value=0.25;const mg=AC.createGain();mg.gain.value=0.9;MASTER.connect(mg);mg.connect(AC.destination)}catch(e){AC=null}}if(AC&&AC.state==='suspended'){AC.resume().catch(()=>{})}return AC}
function nbuf(a){if(!NB){const len=a.sampleRate*2;NB=a.createBuffer(1,len,a.sampleRate);const ch=NB.getChannelData(0);for(let i=0;i<len;i++)ch[i]=Math.random()*2-1}return NB}
function out(dest){return dest||MASTER}
function tone(f,d,type,v,t0,f2,dest,abs){if(!dest&&SET.muted)return;const a=ac();if(!a)return;const t=abs!=null?abs:a.currentTime+(t0||0);const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.15,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(out(dest));o.start(t);o.stop(t+d+0.05)}
function noise(d,v,t0,ftype,f1,f2,q,dest,abs,att){if(!dest)return;/* plus aucun bruit blanc dans les effets (seulement dans la musique) */const a=ac();if(!a)return;const t=abs!=null?abs:a.currentTime+(t0||0);const src=a.createBufferSource();src.buffer=nbuf(a);src.loop=true;const fl=a.createBiquadFilter();fl.type=ftype||'lowpass';fl.frequency.setValueAtTime(f1||1000,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+d);fl.Q.value=q||1;const g=a.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+(att!=null?att:Math.min(0.3,d/3)));g.gain.exponentialRampToValueAtTime(0.0001,t+d);src.connect(fl);fl.connect(g);g.connect(out(dest));src.start(t,Math.random());src.stop(t+d+0.05)}
function whistle(t0,d){if(SET.muted)return;const a=ac();if(!a)return;const t=a.currentTime+t0;const o=a.createOscillator(),lfo=a.createOscillator(),lg=a.createGain(),g=a.createGain();o.type='sine';o.frequency.value=2750;lfo.frequency.value=34;lg.gain.value=160;lfo.connect(lg);lg.connect(o.frequency);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.12,t+0.02);g.gain.setValueAtTime(0.12,t+d-0.04);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(MASTER);o.start(t);lfo.start(t);o.stop(t+d+0.05);lfo.stop(t+d+0.05)}
function clap(t0,v,dest){noise(0.11,v||0.25,t0,'bandpass',1300+Math.random()*500,1000,1.2,dest,null,0.003)}
/* Foule : une vingtaine de « voix » synthétiques filtrées sur les formants d'une voyelle */
const VOW={a:[730,1090,2440],o:[520,860,2410],u:[320,800,2240],e:[530,1840,2480]};
function crowd(vowel,dur,vol,glide,t0,dest){
  return;/* bruits de foule supprimés */const a=ac();if(!a)return;
  const t=a.currentTime+(t0||0),F=VOW[vowel]||VOW.a;glide=glide||1;
  const sum=a.createGain();sum.gain.value=1;
  for(let k=0;k<20;k++){const o=a.createOscillator();o.type='sawtooth';const base=(k%3===0?220:k%3===1?150:110)*(0.85+Math.random()*0.35);o.frequency.setValueAtTime(base,t);o.frequency.exponentialRampToValueAtTime(base*glide,t+dur*0.85);o.detune.value=(Math.random()-.5)*60;
    const vib=a.createOscillator(),vg=a.createGain();vib.frequency.value=4+Math.random()*3;vg.gain.value=base*0.015;vib.connect(vg);vg.connect(o.frequency);
    const g=a.createGain();const on=t+Math.random()*0.3;g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(0.05,on+0.15);o.connect(g);g.connect(sum);o.start(t);vib.start(t);o.stop(t+dur+0.1);vib.stop(t+dur+0.1)}
  const env=a.createGain();env.gain.setValueAtTime(0.0001,t);env.gain.exponentialRampToValueAtTime(vol,t+Math.min(0.35,dur/3));env.gain.setValueAtTime(vol,t+dur*0.55);env.gain.exponentialRampToValueAtTime(0.0001,t+dur);

}

const MUS={on:false,timer:null,next:0,step:0,bpm:112,master:null};
const AMB={on:false,nodes:null,timer:null,g:null};
const BASS=[45,45,48,43];
const mtof=m=>440*Math.pow(2,(m-69)/12);
function musicStart(){if(!SET.music||MUS.on)return;const a=ac();if(!a)return;MUS.master=a.createGain();MUS.master.gain.setValueAtTime(0.0001,a.currentTime);MUS.master.gain.exponentialRampToValueAtTime(0.22,a.currentTime+2);MUS.master.connect(MASTER);MUS.on=true;MUS.next=a.currentTime+0.1;MUS.step=0;MUS.timer=setInterval(musSched,40)}
function musicStop(){if(!MUS.on)return;MUS.on=false;clearInterval(MUS.timer);const a=AC,m=MUS.master;try{m.gain.cancelScheduledValues(a.currentTime);m.gain.setValueAtTime(Math.max(0.0002,m.gain.value),a.currentTime);m.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+0.8)}catch(e){}setTimeout(()=>{try{m.disconnect()}catch(e){}},1000)}
function musSched(){const a=AC;if(!a||!MUS.on)return;const sp=60/MUS.bpm/4;while(MUS.next<a.currentTime+0.15){playStep(MUS.step,MUS.next);MUS.next+=sp;MUS.step=(MUS.step+1)%64}}
function playStep(s,t){const d=MUS.master,b=s%16,bar=Math.floor(s/16)%4;
  if(b%4===0)tone(150,0.22,'sine',0.55,0,42,d,t);
  if(b===4||b===12)noise(0.13,0.22,0,'bandpass',1500,1200,1,d,t,0.002);
  if(b%2===1)noise(0.04,0.06,0,'highpass',7000,null,0.7,d,t,0.002);
  if([0,3,6,10,13].includes(b))tone(mtof(BASS[bar]),0.18,'sawtooth',0.09,0,null,d,t);
  if(b%4===2){const n=BASS[bar]+24+[0,7,12,7][Math.floor(b/4)];tone(mtof(n),0.12,'square',0.025,0,null,d,t)}
  if(MUS.bpm>120&&b%2===0)tone(mtof(BASS[bar]+36),0.06,'triangle',0.02,0,null,d,t)}
function ambStart(){return;if(!SET.amb||AMB.on)return;const a=ac();if(!a)return;AMB.on=true;
  const g=a.createGain();g.gain.setValueAtTime(0.0001,a.currentTime);g.gain.exponentialRampToValueAtTime(1,a.currentTime+2);g.connect(MASTER);AMB.g=g;
  const src=a.createBufferSource();src.buffer=nbuf(a);src.loop=true;const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=700;f.Q.value=0.6;const ng=a.createGain();ng.gain.value=0.05;const lfo=a.createOscillator();lfo.frequency.value=0.11;const lg=a.createGain();lg.gain.value=0.025;lfo.connect(lg);lg.connect(ng.gain);src.connect(f);f.connect(ng);ng.connect(g);src.start();lfo.start();AMB.nodes=[src,lfo];
  const swell=()=>{if(!AMB.on)return;const r=Math.random();if(r<0.45)crowd('a',1.8+Math.random(),0.1,1.06,0,AMB.g);else if(r<0.7)crowd('o',1.4,0.08,0.95,0,AMB.g);else{[0,0.42,0.84,1.06,1.28].forEach(t=>clap(t,0.07,AMB.g))}AMB.timer=setTimeout(swell,6000+Math.random()*8000)};AMB.timer=setTimeout(swell,3000)}
function ambStop(){if(!AMB.on)return;AMB.on=false;clearTimeout(AMB.timer);const a=AC,g=AMB.g;try{g.gain.cancelScheduledValues(a.currentTime);g.gain.setValueAtTime(Math.max(0.0002,g.gain.value),a.currentTime);g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+0.8)}catch(e){}setTimeout(()=>{try{AMB.nodes.forEach(n=>n.stop());g.disconnect()}catch(e){}},1000)}
function soundsOn(){musicStart();ambStart()}
function soundsOff(){musicStop();ambStop()}

const FX={parts:[],ctx:null,cv:null,raf:0,fireUntil:0,pal:'gold'};
function fxInit(){FX.cv=$('#gfx');FX.ctx=FX.cv.getContext('2d');fxSize();window.addEventListener('resize',fxSize)}
function fxSize(){const d=Math.min(2,window.devicePixelRatio||1);FX.cv.width=innerWidth*d;FX.cv.height=innerHeight*d;FX.ctx.setTransform(d,0,0,d,0,0)}
function pal(kind){const m={gold:['--gold1','--gold2','--gold3','--flash','--accent'],goal:['--ok','--gold2','--flash','--accent','--gold1'],legend:['--leg1','--leg2','--leg3','--gold2','--accent'],silver:['--sil1','--sil2','--sil3','--accent','--flash'],bronze:['--brz1','--brz2','--brz3','--gold2','--flash'],power:['--pw1','--pw2','--pw3','--flash','--gold2']};return (m[kind]||m.gold).map(css)}
function burst(x,y,n,power,kind){if(REDUCED)return;const p=pal(kind);for(let k=0;k<n;k++){const a=Math.random()*Math.PI*2,sp=power*(0.25+Math.random());FX.parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-power*0.3,life:1,decay:0.005+Math.random()*0.011,size:3+Math.random()*6,color:p[k%p.length],rot:Math.random()*6,vr:(Math.random()-.5)*0.35,rect:Math.random()<0.6})}if(!FX.raf)FX.raf=requestAnimationFrame(fxLoop)}
function rain(n,kind){if(REDUCED)return;const p=pal(kind);for(let k=0;k<n;k++){FX.parts.push({x:Math.random()*innerWidth,y:-20-Math.random()*innerHeight*0.5,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,life:1,decay:0.004+Math.random()*0.004,size:5+Math.random()*7,color:p[k%p.length],rot:Math.random()*6,vr:(Math.random()-.5)*0.3,rect:true})}if(!FX.raf)FX.raf=requestAnimationFrame(fxLoop)}
function fxLoop(){const c=FX.ctx;c.clearRect(0,0,innerWidth,innerHeight);
  if(Date.now()<FX.fireUntil&&Math.random()<0.07){burst(innerWidth*(0.12+Math.random()*0.76),innerHeight*(0.1+Math.random()*0.4),70,7,FX.pal)}
  FX.parts=FX.parts.filter(p=>p.life>0&&p.y<innerHeight+40);
  for(const p of FX.parts){p.vy+=0.11;p.vx*=0.99;p.x+=p.vx+Math.sin(p.rot)*0.4;p.y+=p.vy;p.rot+=p.vr;p.life-=p.decay;c.globalAlpha=Math.max(0,Math.min(1,p.life*1.5));c.fillStyle=p.color;if(p.rect){c.save();c.translate(p.x,p.y);c.rotate(p.rot);c.fillRect(-p.size/2,-p.size/4,p.size,p.size/2*Math.abs(Math.cos(p.rot*2))+1);c.restore()}else{c.beginPath();c.arc(p.x,p.y,p.size/2,0,6.283);c.fill()}}
  c.globalAlpha=1;if(FX.parts.length||Date.now()<FX.fireUntil){FX.raf=requestAnimationFrame(fxLoop)}else{FX.raf=0}}

/* ================= Résultats ================= */
function computeResults(){
  const maxPts=MAXGAIN*STATS.length;
  const earned=STATS.reduce((a,s)=>a+Math.min(MAXGAIN,S.log.filter(l=>l.st===s.k).reduce((x,l)=>x+l.gain,0)),0);
  const goals=S.shots.filter(Boolean).length;const rem=remaining();
  let note=earned/maxPts*18+goals*0.4-(rem<0?1:0)-0.5*S.codeErrors;
  note=Math.max(0,Math.min(20,Math.round(note*2)/2));
  const n1=S.log.filter(l=>l.res===1).length,n2=S.log.filter(l=>l.res===2).length,n0=S.log.filter(l=>l.res===0).length;
  const ov=overall();
  return{note,goals,rem,used:elapsed(),n1,n2,n0,overall:ov,tier:tierOf(ov),final:STATS.map(s=>statVal(s.k))};
}

function glitter(){if(REDUCED)return;const st=$('#stadium');for(let k=0;k<18;k++){const d=document.createElement('i');d.className='glitter';d.style.left=(Math.random()*100)+'%';d.style.top=(55+Math.random()*45)+'%';d.style.animationDelay=(-Math.random()*6)+'s';d.style.animationDuration=(5+Math.random()*4)+'s';st.appendChild(d)}}
setInterval(tick,250);
let started=false;
function start(data){
  if(started){if(data&&data.S){S=data.S;UI=data.UI||{};route()}return}
  started=true;load();fxInit();glitter();
  if(data&&data.S){S=data.S;UI=data.UI||{};route();return}
  renderSplash();
}
try{if(window.claude&&window.claude.hot&&typeof window.claude.hot.snapshot==='function'){window.claude.hot.snapshot(()=>({S,UI}))}}catch(e){}
const H=window.claude&&window.claude.hot;
if(H&&typeof H.ready==='function'){H.ready(start)}else{start((H&&H.data)||{})}
})();
